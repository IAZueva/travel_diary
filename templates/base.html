<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TravelNotes</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><header><nav><a href="{{url_for('index')}}"><strong>TravelNotes</strong></a><div><a href="{{url_for('index')}}">Все путешествия</a>{% if uid %}<a href="{{url_for('new_trip')}}">+ Запись</a><span>{{username}}</span><form class="inline" method="post" action="{{url_for('logout')}}"><button>Выход</button></form>{% else %}<a href="{{url_for('login')}}">Вход</a><a href="{{url_for('register')}}">Регистрация</a>{% endif %}</div></nav></header><main>{% for msg in get_flashed_messages() %}<div class="flash">{{msg}}</div>{% endfor %}{% block body %}{% endblock %}</main></body></html>
