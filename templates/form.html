{% extends 'base.html' %}{% block body %}<div class="card"><h1>{{'Изменить запись' if trip else 'Новое путешествие'}}</h1><form method="post"><label>Название путешествия</label><input name="title" required value="{{trip.title if trip else ''}}"><label>Страна</label><input name="country" required value="{{trip.country if trip else ''}}"><label>Город / место</label><input name="place" required value="{{trip.place if trip else ''}}"><label>Описание</label><textarea name="description" rows="6" required>{{trip.description if trip else ''}}</textarea><label>Широта (по желанию)</label><input id="lat" name="latitude" type="number" min="-90" max="90" step="any" value="{{trip.latitude if trip and trip.latitude is not none else ''}}"><label>Долгота (по желанию)</label><input id="lon" name="longitude" type="number" min="-180" max="180" step="any" value="{{trip.longitude if trip and trip.longitude is not none else ''}}"><p><button type="button" onclick="navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{document.getElementById('lat').value=p.coords.latitude;document.getElementById('lon').value=p.coords.longitude},()=>alert('Доступ к геопозиции не предоставлен')):alert('Геопозиция недоступна')">Определить геопозицию</button></p><small>Получение GPS-координат требует разрешения браузера и HTTPS (или localhost).</small><label>Ссылка на фотографию (https://...)</label><input name="image_url" type="url" value="{{trip.image_url if trip else ''}}" placeholder="https://...jpg"><label>Стоимость поездки, руб.</label><input name="budget" type="number" step="0.01" min="0" value="{{'%0.2f' % (trip.budget/100) if trip else 0}}"><label>Культурные объекты и места для посещения</label><textarea name="cultural_sites" rows="3">{{trip.cultural_sites if trip else ''}}</textarea><p><button>Сохранить</button></p></form></div>{% endblock %}
