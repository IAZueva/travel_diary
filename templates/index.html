{% extends 'base.html' %}{% block body %}<h1>Дневник путешествий</h1><form class="card filters" method="get"><label>Страна<input name="country" value="{{country}}" placeholder="Например, Россия"></label><label>Поиск по записям<input name="q" value="{{query}}" placeholder="Город, название, описание"></label><button>Найти</button></form><div class="grid">{% for t in rows %}<article class="card">{% if t.image_url %}<img class="preview" src="{{t.image_url}}" alt="Фотография места путешествия" loading="lazy">{% endif %}<h2><a href="{{url_for('show_trip',tid=t.id)}}">{{t.title}}</a></h2><p>{{t.country}} · {{t.place}}</p><p class="muted">Автор: {{t.username}}</p><p>Стоимость: {{t.budget|money}}</p></article>{% else %}<p>Путешествий пока нет. Добавьте первое.</p>{% endfor %}</div>{% endblock %}
